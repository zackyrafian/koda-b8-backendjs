services:
  # api: 
  #   image:  
  postgres: 
    image: postgres:17-alpine 
    environment: 
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    
volumes:
  pgdata: 
